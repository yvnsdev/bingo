<!doctype html><meta charset="utf-8"><title>Casino rooms UI checks</title><pre id="result">RUNNING</pre><div id="frames"></div><script>
(async()=>{const logs=[],assert=(ok,m)=>{if(!ok)throw Error(m);logs.push(m)},tick=()=>new Promise(r=>setTimeout(r,40));
 const player={id:'11111111-1111-4111-8111-111111111111',name:'Ana',active:true,balance:1000,stake:0,choice:'red',status:'waiting',payout:0};
 let room={code:'ABC123',title:'Sala de prueba',game:'blackjack',phase:'betting',round:1,accepting:true,point:0,result:{},dealer:[],dealer_total:null,players:[player],me:null,ledger:[]},calls=[];
 const snapshot=token=>({...room,players:[{...player}],me:token?{...player,hand:room.phase==='playing'?[1,8]:[],total:19}:null});
 const realFetch=fetch,html=await(await realFetch('../index.html')).text(),app=await(await realFetch('../app.js')).text();
 async function page(board=false){const frame=document.createElement('iframe');frame.style='width:390px;height:1100px';document.getElementById('frames').append(frame);await new Promise(resolve=>{frame.onload=resolve;frame.srcdoc=html.replace('<head>','<head><base href="'+new URL('../',location.href).href+'">').replace('<script src="app.js" defer><\/script>','')});const w=frame.contentWindow;if(board)w.history.replaceState(null,'','?sala=ABC123&vista=pantalla');w.createBingoAuth=()=>({validate:async()=>({email:'host@example.test'}),accessToken:async()=>'test-host',signOut:async()=>{},signIn:async()=>{}});w.fetch=async(url,opts)=>{const req=JSON.parse(opts.body);calls.push(req);if(req.p_action==='rooms')return {ok:true,json:async()=>[{code:'ABC123',title:'Sala de prueba'}]};if(req.p_action==='bet'){player.stake=req.p_data.amount;player.balance=1000-player.stake;player.status=player.stake?'bet':'waiting'}return {ok:true,json:async()=>snapshot(req.p_data.token)}};w.eval(app);return {w,d:w.document,$:id=>w.document.getElementById(id)}}
 try{const p=await page();p.$('join-code').value='ABC123';p.$('join-name').value='Ana';p.$('join-form').dispatchEvent(new p.w.Event('submit',{cancelable:true}));await tick();assert(!p.$('participant').hidden,'Phone participant view');assert(p.d.documentElement.scrollWidth<=p.d.documentElement.clientWidth,'Phone layout fits');p.$('bet-form').dispatchEvent(new p.w.Event('submit',{cancelable:true}));await tick();assert(calls.some(c=>c.p_action==='bet'&&c.p_data.round===1&&c.p_data.request_id&&c.p_data.token),'Bets carry token, round and idempotency key');assert(p.$('player-balance').textContent==='950','Balance comes from server');
 const h=await page();h.$('admin-entry').click();await tick();h.$('rooms').value='ABC123';h.$('rooms').dispatchEvent(new h.w.Event('change'));await tick();assert(!h.$('host-controls').hidden,'Admin controls show after room selection');assert(h.$('roster').textContent.includes('Ana'),'Admin sees roster');assert(h.$('admin-board-game').textContent==='Blackjack','Admin sees the selected game board');h.$('game-choice').value='roulette';h.$('game-choice').dispatchEvent(new h.w.Event('change'));assert(h.$('admin-board-stage').textContent.includes('RULETA EUROPEA'),'Admin preview switches to roulette');h.$('grant-all').click();await tick();assert(calls.some(c=>c.p_action==='grant'&&c.p_data.amount===500),'Admin grants funds');assert(h.$('open-bets').disabled&&!h.$('start-round').disabled,'Host phase gates controls');
 room={...room,phase:'playing',dealer:[10,null]};player.status='playing';player.stake=50;
 const b=await page(true);await tick();assert(!b.$('board').hidden&&b.$('admin').hidden,'Public screen opens from its room link without a lobby projection form');assert(b.$('board-stage').querySelector('.card.back'),'Dealer hole card hidden');assert(!b.$('board-players').querySelector('.card'),'Player cards absent from public screen');assert(b.d.body.classList.contains('projecting'),'Presentation layout enabled');
 p.w.document.dispatchEvent(new p.w.Event('visibilitychange'));await new Promise(r=>setTimeout(r,100));assert(!p.$('blackjack-actions').hidden,'Private blackjack controls');assert(p.$('personal-hand').children.length===2,'Private hand displayed');assert(!p.d.querySelector('[data-game="slots"]'),'No slots');document.getElementById('result').textContent='PASS\n'+logs.join('\n');
 }catch(e){document.getElementById('result').textContent='FAIL '+e.stack+'\n'+logs.join('\n')}
})();
</script>
